schema = 2
name = "sim-robocasa"
probe = "components.sim.robocasa"
python = ">=3.10,<3.11"
requires = ["infra-rlinf"]
# RoboCasa installs its own robosuite fork; RoboTwin's runtime pins builds the
# two cannot share.
env_conflicts = ["sim-robotwin"]

dependencies = [
  "rpent-robocasa365 @ git+https://github.com/RLinf/robocasa.git@rpent_v0.2",
  "robosuite @ git+https://github.com/RLinf/robosuite.git@rpent_v0.2",
]
