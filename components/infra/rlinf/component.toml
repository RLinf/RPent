schema = 2
name = "infra-rlinf"
probe = "rlinf"
python = ">=3.10,<3.13"
# The RLinf release runtime is imported by the LIBERO, RoboCasa,
# RoboTwin, Franka, and YAM slices. It has no code of its own, so it
# is an infra component that installs into every environment that
# requires it.

dependencies = [
  "rlinf @ git+https://github.com/RLinf/RLinf.git@2348ece3df113874671478be1360ae3115b346e3",
]
