# Example LeKiwi configuration. `rpent-lekiwi-detect` writes a
# filled-in copy of this file; edit the result and pass it with --robot-config.

robot:
  # Serial bus of the Feetech STS3215 servo board.
  port: /dev/ttyACM0
  wheel_radius: 0.05
  base_radius: 0.125
  max_raw: 3000

cameras:
  devices:
    front:
      # UVC serial of the front camera (ls /dev/v4l/by-id).
      serial: "<front-camera-serial>"
      type: webcam
      main: true

drive:
  step_frequency: 10.0
  # Seconds a step may reuse a captured frame. RLinf's 0.5 s default serves
  # at most two new frames a second; 0.05 tracks the 15 fps camera.
  camera_max_age: 0.05
  max_linear_velocity: 0.3
  max_angular_velocity: 60.0
  frame_size: [128, 128]
