# Set --task-id and --task-language for the selected official task.
# This is still a Planner-run agent: the Planner decides when to call vla_act
# and finish. It is not a pure-VLA baseline with a fixed execution loop.
control_mode: agent
instruction_mode: main
execution_horizon: 32
max_chunks_per_call: 1
tool_allowlist: [view_env_state, vla_act, finish]
# Match the Env service's default chunk_timeout_s=1200, including RPC overhead.
env_rpc_timeout_s: 1230
env_endpoint: null
vla_endpoint: null
