# RPent user-facing config for one physical Franka arm.
#
# This file holds only what is specific to YOUR hardware: machine identity
# (robot IP, camera serials, gripper) and workspace geometry (target/reset
# poses, safety limits). Everything else — primitive-control knobs, action
# scale, tolerances, camera processing — is a developer default in
# robots/franka/runtime_config.py and is applied over RLinf's own dataclass defaults.
#
# Machine identity is resolved at runtime: a command-line flag (--robot-ip,
# --camera-serial-wrist, --camera-serial-external, --gripper-connection)
# overrides the environment variable named by the token below (ROBOT_IP,
# CAMERA_SERIAL_WRIST, ...), which in turn overrides a literal value here.
#
#   python robots/franka/env_server.py --print-config --task-description "grasp"
#   shows the fully resolved RLinf config RPent derives from this file.
robot:
  ip: ROBOT_IP
  end_effector:
    type: franka
    connection: GRIPPER_CONNECTION

cameras:
  devices:
    wrist_1:
      serial: CAMERA_SERIAL_WRIST
      type: realsense
      main: true
    third_person:
      serial: CAMERA_SERIAL_EXTERNAL
      type: realsense

workspace:
  target_ee_pose: [0.65875577, 0.04438992, 0.07458871, 2.94857731, -0.0676843, -0.18130717]
  reset_ee_pose: [0.65875577, 0.04438992, 0.27458871, 2.94857731, -0.0676843, -0.18130717]
  ee_pose_limit_min: [0.15875577, -0.45561008, 0.03458871, 2.93857731, -0.0776843, -1.76130717]
  ee_pose_limit_max: [1.15875577, 0.54438992, 0.27458871, 2.95857731, -0.0576843, 1.39869283]