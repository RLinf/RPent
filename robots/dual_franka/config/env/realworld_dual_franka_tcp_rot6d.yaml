env_type: realworld

total_num_envs: 1
auto_reset: true
ignore_terminations: false
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: false
max_steps_per_rollout_epoch: 300
max_episode_steps: 300
use_spacemouse: false
use_gello: false
use_gello_joint: false
use_relative_frame: false
no_gripper: false
main_image_key: left_wrist_0_rgb

video_cfg:
  save_video: false
  info_on_video: true
  video_base_dir: ${runner.logger.log_path}/video/eval

init_params:
  id: DualFrankaTcpEnv-v1
  num_envs: null

override_cfg:
  is_dummy: false
  task_description: dual arm TCP-rot6d manipulation task
  rotation_repr: rot6d
  max_num_steps: 300
  action_scale: [1.0, 1.0, 1.0]
  ee_pose_limit_min:
    - [0.3, -0.4, 0.1, -3.1416, -3.1416, -3.1416]
    - [0.3, -0.4, 0.1, -3.1416, -3.1416, -3.1416]
  ee_pose_limit_max:
    - [0.8, 0.4, 0.7, 3.1416, 3.1416, 3.1416]
    - [0.8, 0.4, 0.7, 3.1416, 3.1416, 3.1416]
  success_hold_steps: 1