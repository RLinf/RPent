name: Environments

# Reusable clean-machine checks: every affected environment is installed into a
# fresh venv, doctored, and — for simulator environments — exercised by the GPU
# suite. An environment is the component names one install creates. Nothing here
# decides which environments matter.
on:
  workflow_call:
    inputs:
      hosted:
        description: JSON array of environments installed on a hosted runner; each entry is the component names of one environment
        required: false
        type: string
        default: ""
      gpu:
        description: JSON array of environments installed on the embodied runner; each entry is the component names of one environment
        required: false
        type: string
        default: ""
      e2e:
        description: JSON array of simulator suites (libero, robocasa, robotwin)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  hosted:
    name: Install ${{ join(matrix.targets, '+') }}
    if: inputs.hosted != '' && inputs.hosted != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        targets: ${{ fromJSON(inputs.hosted) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Fresh install from the components
        run: |
          ./rpent-install.sh install ${{ join(matrix.targets, ' ') }} \
            --venv ".venv-${{ join(matrix.targets, '+') }}"
      - name: Doctor the installed environment
        run: |
          ./rpent-install.sh doctor \
            --venv ".venv-${{ join(matrix.targets, '+') }}"
      - name: Clean up
        if: always()
        run: find ".venv-${{ join(matrix.targets, '+') }}" -depth -delete

  gpu:
    name: Fresh install ${{ join(matrix.targets, '+') }}
    if: inputs.gpu != '' && inputs.gpu != '[]'
    runs-on: embodied
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        targets: ${{ fromJSON(inputs.gpu) }}
    env:
      # Shared install policy used by RLinf's NVIDIA embodied runner.
      UV_CACHE_DIR: /workspace/dataset/.uv_cache
      UV_LINK_MODE: symlink
      UV_PYTHON_INSTALL_DIR: /workspace/dataset/.uv_python
      UV_TORCH_BACKEND: auto
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Fresh install from the components
        run: |
          ./rpent-install.sh install ${{ join(matrix.targets, ' ') }} \
            --venv ".venv-${{ join(matrix.targets, '+') }}"
      - name: Doctor the installed environment
        run: |
          ./rpent-install.sh doctor \
            --venv ".venv-${{ join(matrix.targets, '+') }}"
      - name: Clean up
        if: always()
        run: find ".venv-${{ join(matrix.targets, '+') }}" -depth -delete

  e2e:
    name: Simulator ${{ matrix.suite }}
    if: inputs.e2e != '' && inputs.e2e != '[]'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.e2e) }}
    # The on-demand workflow owns the runner image, datasets, suite invocation,
    # failure logs, and cleanup, so both entries share one GPU job instead of
    # keeping a second copy here.
    uses: ./.github/workflows/embodied-gpu-e2e-run.yml
    with:
      repository: ${{ github.repository }}
      revision: ${{ github.sha }}
      scope: ci-${{ github.run_id }}
      target: ${{ matrix.suite == 'libero' && 'libero-pro' || matrix.suite }}
