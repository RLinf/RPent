name: Package

# Reusable packaging checks: the wheel carries only the core package, the sdist
# carries the source checkout including robots/ and components/, and both expose the CLI from a fresh environment.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and install the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build sdist and wheel
        env:
          # The published wheel is core-only; the sdist stays complete through
          # MANIFEST.in and is installed from the source scope below.
          RPENT_WHEEL_SCOPE: core
        run: uv build
      - name: Install the wheel into a fresh environment
        run: |
          uv venv --python 3.11 .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl
      - name: Check the wheel install
        run: |
          .venv-wheel/bin/rpent --help >/dev/null
          .venv-wheel/bin/python - <<'PY'
          from pathlib import Path

          import rpent

          root = Path(rpent.__file__).resolve().parent.parent
          for package in ("robots", "components"):
              if (root / package).exists():
                  raise SystemExit(f"{package}/ must not be in the core wheel")
          if not (root / "rpent").is_dir():
              raise SystemExit("rpent/ is missing from the wheel")
          print(sorted(path.name for path in root.iterdir() if path.is_dir()))
          PY
      - name: Install the sdist and upgrade it to the wheel
        run: |
          uv venv --python 3.11 .venv-sdist
          uv pip install --python .venv-sdist/bin/python dist/*.tar.gz
          .venv-sdist/bin/rpent --help >/dev/null
          .venv-sdist/bin/python - <<'PY'
          import components
          import robots

          print(robots.__name__, components.__name__)
          PY
          uv pip install --python .venv-sdist/bin/python --reinstall dist/*.whl
          .venv-sdist/bin/rpent --help >/dev/null
          .venv-sdist/bin/python -c "import rpent; print(rpent.__version__)"
      - name: Check source installs outside the checkout
        run: |
          # `uv pip install .` builds the source-scope wheel, so the component
          # data files must be package data. An editable install must expose
          # the checkout's robots and components from any directory.
          # Runtime dependencies are skipped: `find_spec` reads the installed
          # layout without importing pydantic.
          uv venv --python 3.11 "$RUNNER_TEMP/venv-source"
          uv pip install --python "$RUNNER_TEMP/venv-source/bin/python" \
            --no-deps . packaging
          uv venv --python 3.11 "$RUNNER_TEMP/venv-editable"
          uv pip install --python "$RUNNER_TEMP/venv-editable/bin/python" \
            --no-deps -e . packaging
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-source/bin/python" - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          def package_root(name):
              spec = importlib.util.find_spec(name)
              if spec is None or not spec.submodule_search_locations:
                  sys.exit(f"{name}/ is missing from the source wheel")
              return Path(next(iter(spec.submodule_search_locations)))

          robots = package_root("robots")
          for relative in (
              "robocasa/eval/target50.json",
              "robotwin/eval/demo_randomized.json",
              "franka/config/example.yaml",
              "dual_franka/config/example.yaml",
              "libero/guides/env_calibration.md",
              "yam/config/example.yaml",
          ):
              if not (robots / relative).is_file():
                  sys.exit(f"{relative} is missing from the source wheel")
          PY
          "$RUNNER_TEMP/venv-editable/bin/python" - <<'PY'
          import importlib.util
          import sys

          for name in ("robots", "components"):
              if importlib.util.find_spec(name) is None:
                  sys.exit(f"the editable install does not expose {name}/")
          PY
          "$RUNNER_TEMP/venv-editable/bin/rpent-install" list >/dev/null
