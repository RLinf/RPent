name: Unit tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests (${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install test dependencies
        run: uv pip install --system -e ".[test]"
      - name: Install Flywheel export dependencies
        run: uv pip install --system -e ".[flywheel]" --torch-backend cpu
      - name: Run unit tests with coverage
        run: coverage run --source=rpent,robots -m pytest tests/unit_tests -v
      - name: Generate coverage report
        run: coverage report -m

  # Single stable status check for branch rulesets: the matrix job above reports
  # one check per Python version (test (3.10), ...), which a ruleset cannot match
  # against a single required check.
  unittest:
    name: unittest
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all matrix legs to pass
        run: |
          result='${{ needs.test.result }}'
          echo "matrix result: $result"
          case "$result" in
            success|skipped) exit 0 ;;
            *) echo "::error::unit test matrix did not succeed ($result)"; exit 1 ;;
          esac
