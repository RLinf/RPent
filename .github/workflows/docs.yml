name: Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install documentation dependencies
        run: uv pip install --system -r docs/requirements.txt
      - name: Build English documentation
        run: sphinx-build -W --keep-going docs/source-en docs/build/html-en
      - name: Build Chinese documentation
        if: ${{ !cancelled() }}
        run: sphinx-build -W --keep-going docs/source-zh docs/build/html-zh
