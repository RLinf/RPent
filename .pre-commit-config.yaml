default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.22"
    hooks:
      - id: ruff
        args: ["--preview", "--fix"]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/commit-check/commit-check
    rev: "v2.11.1"
    hooks:
      - id: check-message
        stages: [commit-msg]

  - repo: local
    hooks:
      # CI already runs this before the tests; catching it locally keeps a
      # boundary violation from reaching a pull request.
      - id: check-layout
        name: check the repository layout
        entry: ./tests/tooling/run.sh layout
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
