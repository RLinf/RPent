[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpent"
version = "0.1.0"
authors = [{ name = "RPent Contributors" }]
description = "Embodied agent framework for coordinating high-level reasoning and robot skills"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
keywords = [
    "embodied-intelligence",
    "large-language-models",
    "agent-framework",
]
classifiers = [
    #   2 - Pre-Alpha
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.4",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    # Upgrade together after validating request budgets and failed-request accounting.
    "pydantic-ai-slim[anthropic,openai,cli]==2.53.0",
    "pydantic-ai-harness==0.53.0",
    # Anthropic 2.x turns BetaMessageParam into a non-callable Union.
    # Remove after upgrading Pydantic AI to a release fixing:
    # https://github.com/pydantic/pydantic-ai/issues/10923
    "anthropic<2",
    "pydantic>=2",
    "tomli>=2; python_version < '3.11'",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "claude-agent-sdk>=0.2.154",
    "packaging",
    "openai-codex>=0.163.0",
    "mcp>=1.23.0,<2.0.0",
    "huggingface_hub>=0.24",
    "prompt-toolkit>=3.0.48",
    "numpy",
    "scipy",
    "imageio>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
rpent = "rpent.cli.main:main"
rpent-memory = "rpent.cli.memory:main"
rpent-check-llm = "rpent.cli.check_llm:main"
rpent-flywheel = "rpent.flywheel.cli:main"

[project.urls]
Homepage = "https://github.com/RLinf/RPent"
Repository = "https://github.com/RLinf/RPent"
Documentation = "https://rpent.readthedocs.io/en/latest/"
"Bug Report" = "https://github.com/RLinf/RPent/issues"

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-timeout",
    "omegaconf",
    "gymnasium",
]
flywheel = [
    "lerobot>=0.3.3,<0.4",
    # LeRobot 0.3.x expects Fraction frame rates; PyAV 19 returns AVRational.
    "av<19",
    # OpenPI requires NumPy 1.x; PyArrow 26 requires NumPy 2 at import time.
    "pyarrow<26",
]

# Robot and model installation recipes live under requirements/.
# Use bash requirements/install.sh --help to select an isolated environment.

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# robots is a top-level package; without it, non-editable installations
# leave the CLI unable to import any backend. The globs also cover every
# per-robot subpackage (robots.yam.*, robots.robodojo.*, ...).
include = ["rpent*", "robots", "robots.*"]
exclude = ["tests*", "docs*", "examples*", "docker*", "toolkits*"]

[tool.setuptools.package-data]
"robots.robodojo" = ["guides/*.md"]
"rpent.dashboard" = ["*.html", "static/*.css", "static/*.js"]
"robots.yam" = ["config/*.yaml", "config/*.json", "guides/*.md"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
timeout = 60

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
isort = {known-first-party = ["rpent"]}
select = ["C", "E", "F", "I", "W", "CPY001", "RUF013", "UP006", "PERF102", "PLC1802", "PLC0208", "DOC102", "DOC202", "DOC403", "DOC502"]
ignore = [
    "C901", # "complex-structure"
    "E501", # "line-too-long"
    "E741", # "ambiguous-variable-name"
    "D100", # "Missing docstring in public module"
    "D104", # "Missing docstring in public package"
    "D203", # "incorrect-blank-line-before-class", conflict with D211,
    "D213", # "multi-line-summary-second-line", conflict with D212
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
