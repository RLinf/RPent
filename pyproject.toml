[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpent"
version = "0.0.0"
authors = [{ name = "RPent Contributors" }]
description = "Embodied agent framework for coordinating high-level reasoning and robot skills"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
keywords = [
    "embodied-intelligence",
    "large-language-models",
    "agent-framework",
]
classifiers = [
    #   2 - Pre-Alpha
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.4",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pydantic-ai-slim[anthropic,openai]>=2.1",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "claude-agent-sdk>=0.1.60",
    "openai-codex>=0.1.0b3",
    "huggingface_hub>=0.24",
    "prompt-toolkit>=3.0.48",
    "numpy",
    "imageio>=2.0",
]

[project.scripts]
rpent = "rpent.cli.main:main"

[project.urls]
Homepage = "https://github.com/RLinf/RPent"
Repository = "https://github.com/RLinf/RPent"
Documentation = "https://rpent.readthedocs.io/en/latest/"
"Bug Report" = "https://github.com/RLinf/RPent/issues"

[project.optional-dependencies]
rlinf = [
    "rpent-rlinf",
]
openpi = [
    # rpent-openpi imports the Pi0.5 model code instead of copying it over
    # transformers/, so it runs on stock transformers 4.57 and can share an
    # environment with RLDX-1 (which needs qwen3_vl, added in 4.57).
    # Verified bit-identical to the 4.53 fork it was rebased from.
    # TODO: swap to "rpent-openpi>=0.2.0" once it is on PyPI.
    "rpent-openpi @ git+https://github.com/RLinf/openpi.git@f640522",
]
libero = [
    # LIBERO on robosuite 1.5, so it can share an environment with
    # RoboCasa365. Verified to reproduce the robosuite 1.4 observation
    # contract and action space exactly. rlinf-libero stays on 1.4 for
    # RLinf's own use.
    # TODO: swap to "rpent-libero>=0.2.0" once it is on PyPI.
    "rpent-libero @ git+https://github.com/RLinf/LIBERO.git@ef63e6ee25c7e99feb6a5dcdb40dd4e3d169b2fd",
    "h5py",
]
libero-pro = [
    "rpent[libero]",
    # TODO: swap to "rpent-liberopro>=0.2.0" once uv sees it on PyPI.
    "rpent-liberopro @ git+https://github.com/RLinf/LIBERO-PRO.git@209f5cb35833093cb8c9051032e4c246866382b4",
]
libero-plus = [
    "rpent[libero]",
    "rlinf-liberoplus",
]
sam3 = [
    "sam3==0.1.4",
    "torch",
    "torchvision",
    "pillow>=10",
]
full = [
    "rpent[rlinf,openpi,libero-pro,sam3,robocasa]",
]
robocasa = [
    "rpent[rlinf]",
    # TODO: swap to "rlinf-robocasa365" once it is on PyPI.
    "rlinf-robocasa365 @ git+https://github.com/RLinf/robocasa.git@da9066234b2df5d6d420fc618c321a9ce203b022",
    "rlinf-rldx>=1.0.1.post6",                        # VLA; flash-attn optional, torch 2.7.x
    # RoboCasa365 needs robosuite master; the 1.5.2 release lacks the APIs and
    # reports the same version, so no specifier can select it. Pinned to a sha
    # on the RLinf fork, not upstream @master, so the build is reproducible.
    "robosuite @ git+https://github.com/RLinf/robosuite.git@5ce6643f3092639d08f7b0f90ed1c6a84f50552c",
]

[tool.uv]
prerelease = "allow"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rpent*"]
exclude = ["tests*", "docs*", "examples*", "docker*", "toolkits*"]

[tool.setuptools.package-data]
"rpent.dashboard" = ["*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
isort = {known-first-party = ["rpent"]}
select = ["C", "E", "F", "I", "W", "CPY001", "RUF013", "UP006", "PERF102", "PLC1802", "PLC0208", "DOC102", "DOC202", "DOC403", "DOC502"]
ignore = [
    "C901", # "complex-structure"
    "E501", # "line-too-long"
    "E741", # "ambiguous-variable-name"
    "D100", # "Missing docstring in public module"
    "D104", # "Missing docstring in public package"
    "D203", # "incorrect-blank-line-before-class", conflict with D211,
    "D213", # "multi-line-summary-second-line", conflict with D212
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
