[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpent"
version = "0.0.0"
authors = [{ name = "RPent Contributors" }]
description = "Embodied agent framework for coordinating high-level reasoning and robot skills"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
keywords = [
    "embodied-intelligence",
    "large-language-models",
    "agent-framework",
]
classifiers = [
    #   2 - Pre-Alpha
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.4",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pydantic-ai-slim[anthropic,openai]>=2.1",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "claude-agent-sdk>=0.1.60",
    "openai-codex>=0.1.0b3",
    "mcp>=1.23.0,<2.0.0",
    "huggingface_hub>=0.24",
    "prompt-toolkit>=3.0.48",
    "numpy",
    "scipy",
    "imageio>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
rpent = "rpent.cli.main:main"
rpent-memory = "rpent.cli.memory:main"
rpent-check-llm = "rpent.cli.check_llm:main"
rpent-flywheel = "rpent.flywheel.cli:main"

[project.urls]
Homepage = "https://github.com/RLinf/RPent"
Repository = "https://github.com/RLinf/RPent"
Documentation = "https://rpent.readthedocs.io/en/latest/"
"Bug Report" = "https://github.com/RLinf/RPent/issues"

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-timeout",
    "omegaconf",
    "gymnasium",
]
rlinf = [
    "rpent-rlinf",
]
sam3 = [
    "sam3 @ git+https://github.com/RLinf/sam3.git@main",
    "einops>=0.8.0",
    "pycocotools",
    "torch",
    "torchvision",
    "pillow>=10",
]
molmo = [
    # Molmo's remote code uses transformers' video-processing API, which the
    # LIBERO extra cannot supply: OpenPI pins transformers==4.53.2 exactly, and
    # 4.53.2 has no transformers.video_utils.make_batched_metadata. Install this
    # into its own environment and point the grounder at it over RPC.
    "transformers>=4.57",
    "torch",
    "torchvision",
    "pillow>=10",
]
libero = [
    "rpent[rlinf,sam3]",
    "rpent-openpi @ git+https://github.com/RLinf/openpi.git@rpent",
    "rpent-libero @ git+https://github.com/RLinf/LIBERO.git@rpent",
    # MuJoCo 3.4+ changes LIBERO settling, misplacing objects and reducing task success; see https://github.com/RLinf/RLinf/issues/1460.
    "mujoco==3.3.0",
]
libero-pro = [
    "rpent[libero]",
    "rpent-liberopro @ git+https://github.com/RLinf/LIBERO-PRO.git@rpent",
]
libero-plus = [
    # LIBERO-plus requires robosuite<1.5, so it cannot inherit the standard LIBERO extra.
    "rpent[rlinf,sam3]",
    "rpent-openpi @ git+https://github.com/RLinf/openpi.git@rpent",
    "rlinf-liberoplus",
    "mujoco==3.3.0",
    "h5py",
]
franka = [
    "rlinf[franka] @ git+https://github.com/jx-qiu/RLinf.git@port/franka",
    "rpent-openpi @ git+https://github.com/RLinf/openpi.git@rpent",
    "franky-control @ https://github.com/Brunch-Life/franky/releases/download/wheels-libfranka-0.19.0/franky_control-1.1.3-cp310-cp310-manylinux_2_28_x86_64.whl ; python_version == '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "franky-control @ https://github.com/Brunch-Life/franky/releases/download/wheels-libfranka-0.19.0/franky_control-1.1.3-cp311-cp311-manylinux_2_28_x86_64.whl ; python_version == '3.11' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "franky-control @ https://github.com/Brunch-Life/franky/releases/download/wheels-libfranka-0.19.0/franky_control-1.1.3-cp312-cp312-manylinux_2_28_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "matplotlib>=3.8",
    "pillow>=10",
]
robocasa = [
    "rpent[rlinf]",
    "rpent-robocasa365 @ git+https://github.com/RLinf/robocasa.git@rpent",
    "rlinf-rldx @ git+https://github.com/RLinf/RLDX-1.git@rpent",
    "robosuite @ git+https://github.com/RLinf/robosuite.git@rpent",
]
flywheel = [
    "lerobot>=0.3.3,<0.4",
]
robotwin = [
    "rpent[rlinf]",
    "rlinf-robotwin-runtime==0.1.1",
    "rlinf-lingbotvla==0.1.1",
    "nvidia-curobo @ git+https://github.com/NVlabs/curobo.git@v0.7.8",
]

robodojo = [
    "rpent[robodojo-sim,sam3]",
    # The RoboDojo openpi config/policy live on this branch, not in the
    # released rpent-rlinf.
    "rlinf @ git+https://github.com/qurakchin/rlinf.git@rlinf_robodojo",
    "rpent-openpi @ git+https://github.com/RLinf/openpi.git@rpent",
]
robodojo-sim = [
    # Install RoboDojo's IsaacLab fork editable in the same environment: a
    # non-editable VCS-subdirectory install of `isaaclab` ships only
    # `__init__.py` and loses `config/extension.toml`, which
    # `isaaclab/__init__.py` loads through `ISAACLAB_EXT_DIR`.
    # Keep Isaac Sim and the Torch family pinned: Isaac Sim's version and
    # CuRobo's build/runtime ABI are tightly coupled.
    "isaacsim[all,extscache]==5.1.0",
    "isaaclab @ git+https://github.com/yuechen0614/IsaacLab.git@main#subdirectory=source/isaaclab",
    "isaaclab_assets @ git+https://github.com/yuechen0614/IsaacLab.git@main#subdirectory=source/isaaclab_assets",
    "isaaclab_tasks @ git+https://github.com/yuechen0614/IsaacLab.git@main#subdirectory=source/isaaclab_tasks",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
    "nvidia-curobo[cu12] @ git+https://github.com/yuechen0614/curobo.git@main",
    # CuRobo runtime minimums based on the validated deployment.
    "tyro>=0.9.0",
    "websockets>=12.0",
    # Runtime minimums based on the pins RoboDojo applies on top of Isaac Sim
    # (`pin_runtime_deps` in scripts/install.sh).
    "numpy>=1.26.0",
    "filelock>=3.13.1",
    "warp-lang>=1.11.0",
    "onnx>=1.18,<1.22",
    "ipython<9",
    # RoboDojo's own Python dependencies that its env server actually imports.
    "opencv-python-headless>=4.11.0.86",
    "pillow",
    "scipy>=1.15.3",
    "transforms3d",
    # `RoboDojo/env/scene_manager/layout_manager.py` imports these at module
    # level, and the scene manager pulls that file in on the env-server boot
    # path, so they were missing from this list.
    "shapely",
    "omegaconf",
    # `isaaclab/isaaclab/utils/datasets/hdf5_dataset_file_handler.py` (imported
    # by `isaaclab.utils.datasets`) and `isaaclab_tasks/direct/automate/`
    # import h5py directly; it was missing from this list.
    "h5py",
]

[tool.uv]
prerelease = "allow"

# Upstream packaging defects that make `rpent[robodojo-sim]` unsatisfiable.
# They live here instead of an external `--override` file so that a clean
# install resolves with no extra flags. uv reads `override-dependencies` from
# the pyproject.toml discovered in the current directory, so run e.g.
# `cd rpent && uv pip install -e ".[robodojo-sim]"`.
override-dependencies = [
    # isaacsim-core==5.1.0.0 declares `pywin32==306` with NO platform marker,
    # which makes Linux resolution fail. Force it back to Windows-only.
    "pywin32==306 ; sys_platform == 'win32'",
    # isaaclab==0.54.3 pins starlette==0.49.1, while isaacsim-kernel==5.1.0.0
    # -> fastapi==0.115.7 needs starlette>=0.40,<0.46. RoboDojo's own
    # `pin_runtime_deps` installs starlette==0.45.3.
    "starlette==0.45.3",
    # isaacsim-kernel==5.1.0.0 pins typing-extensions==4.12.2 exactly. This
    # only bites when RPent's agent deps share the sim env
    # (pydantic-ai-slim -> pydantic>=2.12 -> typing-extensions>=4.14). The
    # temporary simulator setup installs RPent with `--no-deps`. This
    # override preserves the simulator pin for resolution; it does not
    # establish compatibility with the full agent stack.
    "typing-extensions==4.12.2",
]

# Remaining upstream blockers for the single-environment robodojo extra:
# - isaacsim-kernel==5.1.0.0 pins uvicorn==0.29.0; mcp>=1.23.0 needs >=0.31.1.
# - isaacsim-kernel==5.1.0.0 pins wrapt==1.16.0; rlinf's swanlab>=0.6.11
#   needs wrapt>=1.17.0.
# - isaacsim-core==5.1.0.0 pins filelock==3.13.1; rpent-openpi needs >=3.16.1.
# - rpent-openpi==0.2.2 pins torch==2.7.1; the simulator requires torch==2.7.0.
# The agreed approach is to relax them in rlinf-prefixed forks of the
# affected packages and then point these references back at the official
# branches.
# Do not bypass these constraints with additional RPent overrides.

# Each robot extra pulls a separately pinned VLA runtime whose Torch,
# Transformers, Tokenizers, or Diffusers versions are mutually incompatible.
conflicts = [
    [
        { extra = "franka" },
        { extra = "libero" },
    ],
    [
        { extra = "franka" },
        { extra = "libero-pro" },
    ],
    [
        { extra = "franka" },
        { extra = "libero-plus" },
    ],
    [
        { extra = "franka" },
        { extra = "robocasa" },
    ],
    [
        { extra = "franka" },
        { extra = "robotwin" },
    ],
    [
        { extra = "robocasa" },
        { extra = "robotwin" },
    ],
]

[tool.uv.extra-build-dependencies]
# Match robodojo-sim's runtime Torch: differing build-time and runtime
# versions can cause ABI drift.
nvidia-curobo = ["torch==2.7.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# robots is a top-level package; without it, non-editable installations
# leave the CLI unable to import any backend.
include = ["rpent*", "robots*"]
exclude = ["tests*", "docs*", "examples*", "docker*", "toolkits*"]

[tool.setuptools.package-data]
"rpent.dashboard" = ["*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
timeout = 60

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
isort = {known-first-party = ["rpent"]}
select = ["C", "E", "F", "I", "W", "CPY001", "RUF013", "UP006", "PERF102", "PLC1802", "PLC0208", "DOC102", "DOC202", "DOC403", "DOC502"]
ignore = [
    "C901", # "complex-structure"
    "E501", # "line-too-long"
    "E741", # "ambiguous-variable-name"
    "D100", # "Missing docstring in public module"
    "D104", # "Missing docstring in public package"
    "D203", # "incorrect-blank-line-before-class", conflict with D211,
    "D213", # "multi-line-summary-second-line", conflict with D212
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
