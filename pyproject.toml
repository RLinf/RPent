[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpent"
version = "0.0.0"
authors = [{ name = "RPent Contributors" }]
description = "Embodied agent framework for coordinating high-level reasoning and robot skills"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
keywords = [
    "embodied-intelligence",
    "large-language-models",
    "agent-framework",
]
classifiers = [
    #   2 - Pre-Alpha
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.4",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pydantic-ai-slim[anthropic,openai]>=2.1",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "claude-agent-sdk>=0.1.60",
    "openai-codex>=0.1.0b3",
    "mcp>=1.23.0,<2.0.0",
    "huggingface_hub>=0.24",
    "prompt-toolkit>=3.0.48",
    "numpy",
    "scipy",
    "imageio>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
rpent = "rpent.cli.main:main"
rpent-memory = "rpent.cli.memory:main"
rpent-check-llm = "rpent.cli.check_llm:main"
rpent-flywheel = "rpent.flywheel.cli:main"

[project.urls]
Homepage = "https://github.com/RLinf/RPent"
Repository = "https://github.com/RLinf/RPent"
Documentation = "https://rpent.readthedocs.io/en/latest/"
"Bug Report" = "https://github.com/RLinf/RPent/issues"

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-timeout",
    "omegaconf",
    "gymnasium",
]
rlinf = [
    "rpent-rlinf",
]
sam3 = [
    "sam3 @ git+https://github.com/RLinf/sam3.git@main",
    "einops>=0.8.0",
    "pycocotools",
    "torch",
    "torchvision",
    "pillow>=10",
]
molmo = [
    # Molmo's remote code uses transformers' video-processing API, which the
    # LIBERO extra cannot supply: OpenPI pins transformers==4.53.2 exactly, and
    # 4.53.2 has no transformers.video_utils.make_batched_metadata. Install this
    # into its own environment and point the grounder at it over RPC.
    "transformers>=4.57",
    "torch",
    "torchvision",
    "pillow>=10",
]
libero = [
    "rpent[rlinf,sam3]",
    "rpent-openpi @ git+https://github.com/RLinf/openpi.git@rpent",
    "rpent-libero @ git+https://github.com/RLinf/LIBERO.git@rpent",
    # MuJoCo 3.4+ changes LIBERO settling, misplacing objects and reducing task success; see https://github.com/RLinf/RLinf/issues/1460.
    "mujoco==3.3.0",
]
libero-pro = [
    "rpent[libero]",
    "rpent-liberopro @ git+https://github.com/RLinf/LIBERO-PRO.git@rpent",
]
libero-plus = [
    # LIBERO-plus requires robosuite<1.5, so it cannot inherit the standard LIBERO extra.
    "rpent[rlinf,sam3]",
    "rpent-openpi @ git+https://github.com/RLinf/openpi.git@rpent",
    "rlinf-liberoplus",
    "mujoco==3.3.0",
    "h5py",
]
franka = [
    "rlinf[franka] @ git+https://github.com/RLinf/RLinf.git@bde6c918642abf9a4776cb1d5fabcc5087dfe195",
    "rpent-openpi @ git+https://github.com/RLinf/openpi.git@rpent",
    "franky-control @ https://github.com/Brunch-Life/franky/releases/download/wheels-libfranka-0.19.0/franky_control-1.1.3-cp310-cp310-manylinux_2_28_x86_64.whl ; python_version == '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "franky-control @ https://github.com/Brunch-Life/franky/releases/download/wheels-libfranka-0.19.0/franky_control-1.1.3-cp311-cp311-manylinux_2_28_x86_64.whl ; python_version == '3.11' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "franky-control @ https://github.com/Brunch-Life/franky/releases/download/wheels-libfranka-0.19.0/franky_control-1.1.3-cp312-cp312-manylinux_2_28_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "matplotlib>=3.8",
    "pillow>=10",
]
robocasa = [
    "rpent[rlinf]",
    "rpent-robocasa365 @ git+https://github.com/RLinf/robocasa.git@rpent",
    "rlinf-rldx @ git+https://github.com/RLinf/RLDX-1.git@rpent",
    "robosuite @ git+https://github.com/RLinf/robosuite.git@rpent",
]
flywheel = [
    "lerobot>=0.3.3,<0.4",
]
robotwin = [
    "rpent[rlinf]",
    "rlinf-robotwin-runtime==0.1.1",
    "rlinf-lingbotvla==0.1.1",
    "nvidia-curobo @ git+https://github.com/NVlabs/curobo.git@v0.7.8",
]

robodojo-sim = [
    "rlinf @ git+https://github.com/littleZ05/RLinf.git@feat/robodojo-env",
    "rlinf-robodojo-runtime @ git+https://github.com/littleZ05/RoboDojo.git@rpent",
    # uv reads build overrides only from the root project.
    "nvidia-curobo[cu12] @ git+https://github.com/yuechen0614/curobo.git@main",
]

[tool.uv]
prerelease = "allow"
override-dependencies = [
    # Simulator metadata includes a Windows dependency without a platform marker.
    "pywin32==306 ; sys_platform == 'win32'",
    # Reconcile IsaacLab and Isaac Sim's FastAPI requirements.
    "starlette==0.45.3",
    # RPent and RLinf require newer versions than the simulator metadata allows.
    "typing-extensions>=4.14",
    "uvicorn>=0.31.1",
    "wrapt>=1.17.0,<2",
]
# Keep FastAPI compatible with the overridden Starlette in base installs too.
constraint-dependencies = [
    "fastapi>=0.115.7,<0.116",
    "sse-starlette>=1.6.1,<3",
]

# Each robot extra pulls a separately pinned VLA runtime whose Torch,
# Transformers, Tokenizers, or Diffusers versions are mutually incompatible.
conflicts = [
    [
        { extra = "franka" },
        { extra = "libero" },
    ],
    [
        { extra = "franka" },
        { extra = "libero-pro" },
    ],
    [
        { extra = "franka" },
        { extra = "libero-plus" },
    ],
    [
        { extra = "franka" },
        { extra = "robocasa" },
    ],
    [
        { extra = "franka" },
        { extra = "robotwin" },
    ],
    [
        { extra = "robocasa" },
        { extra = "robotwin" },
    ],
]

[tool.uv.extra-build-dependencies]
nvidia-curobo = [{ requirement = "torch", match-runtime = true }]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rpent*"]
exclude = ["tests*", "docs*", "examples*", "docker*", "toolkits*"]

[tool.setuptools.package-data]
"rpent.dashboard" = ["*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
timeout = 60

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
isort = {known-first-party = ["rpent"]}
select = ["C", "E", "F", "I", "W", "CPY001", "RUF013", "UP006", "PERF102", "PLC1802", "PLC0208", "DOC102", "DOC202", "DOC403", "DOC502"]
ignore = [
    "C901", # "complex-structure"
    "E501", # "line-too-long"
    "E741", # "ambiguous-variable-name"
    "D100", # "Missing docstring in public module"
    "D104", # "Missing docstring in public package"
    "D203", # "incorrect-blank-line-before-class", conflict with D211,
    "D213", # "multi-line-summary-second-line", conflict with D212
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
