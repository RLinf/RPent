[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpent"
version = "0.1.0"
authors = [{ name = "RPent Contributors" }]
description = "Embodied agent framework for coordinating high-level reasoning and robot skills"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
keywords = [
    "embodied-intelligence",
    "large-language-models",
    "agent-framework",
]
classifiers = [
    #   2 - Pre-Alpha
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.4",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

# The runtime layer: environment and model contracts, RPC, model clients, and
# the installer. It holds only what those modules import at import time, so a
# simulator or model environment can install it without the planner stack.
dependencies = [
    "numpy",
    # `NotRequired` in the model contracts.
    "typing-extensions>=4",
    # `rpent-install` parses requirement strings, which the core layer
    # needs without the planner extra.
    "packaging",
    "tomli>=2; python_version < '3.11'",
    # Frame encoding in the model clients, which the runtime layer ships.
    "imageio>=2.0",
    # The tool contracts declare their input schemas with pydantic. The
    # planner-side ``pydantic_ai`` schema builder is imported lazily.
    "pydantic>=2",
    # The memory manager parses layered prompt files, and robot specs import it
    # when the runtime layer loads a robot without the planner stack.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# `rpent[planner]` is the core's own dependency split, not a component: planner
# adapters, execution sessions, tools, prompts, and the dashboard. Components
# that import it say so with `planner = true` in their manifest.
planner = [
    # Upgrade together after validating request budgets and failed-request accounting.
    # The MCP client comes from `mcp` below: pydantic-ai's `mcp` extra pulls
    # fastmcp, which requires beartype>=0.20 and cannot coexist with the
    # beartype==0.19.0 that `rpent-openpi` pins.
    "pydantic-ai-slim[anthropic,google,openai,cli]==2.53.0",
    "pydantic-ai-harness==0.53.0",
    # Google GenAI 3.x changes the default API path from v1beta to v1.
    "google-genai<3",
    # Anthropic 2.x turns BetaMessageParam into a non-callable Union.
    # Remove after upgrading Pydantic AI to a release fixing:
    # https://github.com/pydantic/pydantic-ai/issues/10923
    "anthropic<2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "claude-agent-sdk>=0.2.154",
    "openai-codex>=0.163.0",
    "agent-client-protocol>=0.12.1,<0.13",
    "mcp>=1.23.0,<2.0.0",
    "huggingface_hub>=0.24",
    "prompt-toolkit>=3.0.48",
    "scipy",
    # `--mcp-config` is a core CLI flag and resolves `${oc.env:...}` with
    # OmegaConf, so the planner layer carries it rather than a robot component.
    "omegaconf>=2.3,<3",
]

[project.scripts]
rpent = "rpent.cli.main:main"
rpent-install = "rpent.cli.install:main"
rpent-memory = "rpent.cli.memory:main"
rpent-check-llm = "rpent.cli.check_llm:main"
rpent-flywheel = "rpent.cli.flywheel:main"

[project.urls]
Homepage = "https://github.com/RLinf/RPent"
Repository = "https://github.com/RLinf/RPent"
Documentation = "https://rpent.readthedocs.io/en/latest/"
"Bug Report" = "https://github.com/RLinf/RPent/issues"

[tool.uv]
prerelease = "allow"

[tool.uv.extra-build-dependencies]
# Build RoboTwin's Torch extensions against its runtime Torch version.
# RoboDojo's fork skips Torch extension builds by default (CUROBO_USE_PYBIND=0).
nvidia-curobo = ["torch==2.8.0"]

[tool.setuptools]
include-package-data = true
# Package discovery lives in setup.py because the published wheel and a
# source install intentionally differ: the wheel contains only rpent/, while
# editable and sdist builds also include robots/ and components/.

[tool.setuptools.package-data]
# Component manifests are runtime data: discovery reads them from installed
# packages, so a component that ships code must ship its component.toml with it,
# and an override the manifest names ships with it too. Components that only
# declare dependencies (`components/infra/*`, `sim-libero_plus`,
# `robot-libero_plus`) hold no package and exist only in a checkout. The other
# entries are files the installed
# package opens by path: the dashboard frontend, the robot defaults, the
# evaluation manifests, and RoboDojo's uv override.
"*" = ["component.toml"]
"components.sim.robodojo" = ["requirements/*.txt"]
"components.sim.robotwin" = ["eval/*.json"]
"robots.dual_franka" = ["config/*.yaml"]
"robots.franka" = ["config/*.yaml"]
"robots.libero" = ["guides/*.md"]
"robots.robocasa" = ["eval/*.json"]
"robots.robodojo" = ["guides/*.md"]
"robots.robotwin" = ["guides/*.md"]
"rpent.dashboard" = ["*.html", "static/*.css", "static/*.js"]
"robots.yam" = ["config/*.yaml", "config/*.json", "guides/*.md"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
timeout = 60

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
isort = {known-first-party = ["rpent"]}
select = ["C", "E", "F", "I", "W", "CPY001", "RUF013", "UP006", "PERF102", "PLC1802", "PLC0208", "DOC102", "DOC202", "DOC403", "DOC502"]
ignore = [
    "C901", # "complex-structure"
    "E501", # "line-too-long"
    "E741", # "ambiguous-variable-name"
    "D100", # "Missing docstring in public module"
    "D104", # "Missing docstring in public package"
    "D203", # "incorrect-blank-line-before-class", conflict with D211,
    "D213", # "multi-line-summary-second-line", conflict with D212
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
