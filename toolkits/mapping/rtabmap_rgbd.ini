# Native RTAB-Map configuration example. Replace every /path/to/... path.
# Copy to a fresh output directory as rtabmap.ini before running the tools.
# localTransform: measured camera mounting pose relative to the robot frame,
# x/y/z in metres and mechanical RPY in radians (x forward, y left, z up).
# For RAFT output, use the rectification-adjusted value logged by prepare_stereo.
# The example assumes a level, forward-facing camera 0.5 m above the robot origin.
# Input must be aligned, undistorted RGB with uint16 millimetre depth.
# Invalid depth pixels are 0; matching filenames are timestamps in seconds.

[Core]
Rtabmap\WorkingDirectory=/path/to/new-map
Rtabmap\DetectionRate=0
RGBD\CreateOccupancyGrid=true
Grid\Sensor=1

[Camera]
type=0
rgbd\driver=7
imgRate=0
calibrationName=/path/to/rgbd/camera.yaml
localTransform=0 0 0.5 0 0 0
RGBDImages\path_rgb=/path/to/rgbd/rgb
RGBDImages\path_depth=/path/to/rgbd/depth
RGBDImages\scale=1
Images\filenames_as_stamps=true
Images\sync_stamps=false
