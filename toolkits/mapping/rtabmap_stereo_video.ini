# Native RTAB-Map configuration example. Replace every /path/to/... path.
# Copy to a fresh output directory as rtabmap.ini before running the tools.
# localTransform: actual camera mechanical pose, x/y/z in metres and RPY
# in radians, relative to x-forward, y-left, z-up axes with ground at z=0.
# The example pose assumes a level, forward-facing camera 0.5 m above ground.
# Input is already rectified; set StereoImages\rectify=true for raw input.
# Calibration must match per-eye dimensions and rectification state.
# Side-by-side video: left view first; set imgRate to its actual frame rate.

[Core]
Rtabmap\WorkingDirectory=/path/to/new-map
Rtabmap\DetectionRate=0
RGBD\CreateOccupancyGrid=true
Grid\Sensor=1

[Camera]
type=1
stereo\driver=3
stereo\depthGenerated=false
stereo\rightGrayScale=true
imgRate=15
calibrationName=/path/to/stereo/camera_left.yaml
localTransform=0 0 0.5 0 0 0
StereoVideo\path=/path/to/stereo.mp4
StereoVideo\path2=
StereoImages\rectify=false
Images\filenames_as_stamps=false
