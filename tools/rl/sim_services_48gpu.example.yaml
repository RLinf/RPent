#     host: 10.0.0.11
#     port: 28561
#     request_timeout_s: 1800
#     backends:
#       - http://10.0.0.10:28551   # dedicated sim node (32)
#       - http://10.0.0.11:28551   # RL node 0 (40, sleepable)
#       - http://10.0.0.12:28551   # RL node 1 (40, sleepable)
#       - http://10.0.0.13:28551   # RL node 2 (40, sleepable)
#       - http://10.0.0.14:28551   # RL node 3 (40, sleepable)
#   robotwin:
#     python: /tmp/rpent_ppo/envs/libero/bin/python
#     host: 10.0.0.11
#     port: 28562
#     request_timeout_s: 1800
#     backends:
#       - http://10.0.0.10:28552   # dedicated sim node (48)
#       - http://10.0.0.11:28552   # RL node 0 (16, sleepable)
#       - http://10.0.0.12:28552   # RL node 1 (16, sleepable)
#       - http://10.0.0.13:28552   # RL node 2 (16, sleepable)
#       - http://10.0.0.14:28552   # RL node 3 (16, sleepable)
#       - http://127.0.0.1:28572   # remote A100 cluster via jump-host SSH tunnel (80)
